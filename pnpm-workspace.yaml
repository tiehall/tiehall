packages:
  - apps/*
  - packages/*
  - actions/*
  - tools/*
  # Never workspace projects: agent state, throwaway spikes and the OpenSpec plan.
  - "!.claude/**"
  - "!spikes/**"
  - "!openspec/**"

# Resolve only versions published at least 7 days ago (10080 minutes), the same
# release age Renovate waits for (self-host-install: Release pipeline integrity).
minimumReleaseAge: 10080

# Dependency install scripts are denied unless listed here as true, and an
# install fails while a dependency's script is on neither side of the list
# (self-host-install: Release pipeline integrity; checked by
# `pnpm check:workflows`).
strictDepBuilds: true
allowBuilds:
  # Optional native helper of ssh2 (Testcontainers); a pure-JS path is used without it.
  cpu-features: false
  # Checks its platform binary (drizzle-kit, a dev tool); esbuild finds the binary
  # in its optional @esbuild/<platform> package without it.
  esbuild: false
  # A version-check postinstall only.
  protobufjs: false
  # Builds an optional native crypto binding; ssh2 falls back to pure JS.
  ssh2: false
  # Rewrites its entry files for Vue 2 or 3 (a dependency of Scalar's sources);
  # the files it ships are Vue 3's, and the web app serves Scalar's prebuilt
  # browser bundle, never these sources.
  vue-demi: false

# One version for tools that several workspace packages use.
catalog:
  "@types/node": 24.13.5
  "@types/pg": 8.23.1
  "@testcontainers/postgresql": 12.1.0
  dependency-cruiser: 18.3.1
  drizzle-orm: 0.45.2
  pg: 8.23.0
  typescript: 6.0.3
  vitest: 5.0.1
  yaml: 2.9.1
  zod: 4.6.5

# drizzle-orm takes kysely as an optional peer, and the sign-in library brings
# kysely along. Without this, packages/commands and packages/db would each get
# a copy of drizzle-orm of their own, one with kysely and one without, whose
# types do not mix. With kysely as drizzle-orm's own dependency, there is one.
packageExtensions:
  drizzle-orm@0.45.2:
    dependencies:
      kysely: 0.29.6

# Scalar's API reference package depends on its agent chat, which brings the
# Vercel AI SDK (ai and @ai-sdk/*), a model SDK. The web app serves only the
# package's prebuilt browser bundle, with the agent chat switched off and a
# Content-Security-Policy that lets the page reach no other host
# (apps/web/lib/api-reference.ts), and imports none of the package's modules.
# So the agent chat is left out of the dependency graph, and the lockfile
# resolves no model SDK (self-host-install: No model calls; checked by
# `pnpm check:model-sdks`).
overrides:
  "@scalar/api-reference>@scalar/agent-chat": "-"
