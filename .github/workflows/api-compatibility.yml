name: API compatibility

# Notice before a breaking change, enforced on every pull request
# (public-api: Notice before a breaking change is enforced in CI; public-api:
# The `api-breaking` label for urgent security fixes; public-api: MCP tools
# follow the same compatibility rules; handoff-packet: Breaking packet changes
# before publication), and the label of an exception to the release age
# (self-host-install: Release pipeline integrity). It lives apart from ci.yml
# because it also runs when a label is added or removed, so adding the
# api-breaking or the release-age-exception label runs the checks again
# without a new push.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Jobs get no token permissions unless they declare them.
permissions: {}

# A newer run for the same pull request replaces one still running.
concurrency:
  group: api-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-compatibility:
    name: API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds no secrets: oasdiff is third-party code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch's history, for the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The check reads openapi/changelog.json through @tiehall/catalog/changelog,
      # which imports only Node built-ins.
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks
      # The pinned oasdiff release, downloaded from GitHub and run only once
      # its archive matches the SHA-256 in tools/repo-checks/oasdiff.json.
      - run: node tools/repo-checks/src/install-oasdiff.ts
      # Compares openapi/v1.json at the merge base with the pull request's and
      # fails on a breaking change that skips the notice steps or leaves
      # info.version as it was. With the api-breaking label, a breaking change
      # passes only when the pull request also adds a changelog entry of kind
      # breaking to openapi/changelog.json and bumps info.version. The labels
      # come from the event, through the environment, never into the script.
      - run: node tools/repo-checks/src/check-api-compat.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      # An exclusion from the 7-day release age, which takes the version an
      # advisory names as fixed before it is 7 days old, passes only on a pull
      # request with the release-age-exception label; pnpm check:workflows
      # checks the exclusion's record in tools/repo-checks/release-age-exceptions.json
      # and its day. The labels come from the event, through the environment,
      # never into the script.
      - run: node tools/repo-checks/src/check-release-age-label.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      # contract.report's own CLI floor rises only with 180 days' notice: a
      # pull request that raises it passes only when openapi/changelog.json
      # holds an entry about contract.report, naming the new floor, dated at
      # least 180 days earlier.
      - run: node tools/repo-checks/src/check-contract-report-floor.ts
        env:
          BASE_REF: ${{ github.base_ref }}
      # Compares mcp/tools.json at the merge base with the pull request's, with
      # the same oasdiff and notice periods, reading each tool as an operation
      # at the stability level and with the deprecation the snapshot records:
      # a beta tool is removed, or gains a required argument, only after the
      # notice, and a stable tool only gains things: a breaking change takes a
      # new tool name, never one a stable tool had in an earlier snapshot of
      # the base branch, and the old tool stays at least six months after its
      # deprecation. With the api-breaking label, a break passes only when the
      # pull request also adds a changelog entry of kind breaking. ci.yml's MCP
      # tools job has checked that the snapshot is what the catalog generates.
      - run: node tools/repo-checks/src/check-tool-compat.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  packet-compatibility:
    name: Packet fixture compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch's history, for the merge base and every earlier
          # version of the packet fixtures.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The check validates the fixtures with the packet's own validator, so packages/packet is installed too.
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks --filter @tiehall/packet
      # Every version of every valid packet fixture up to the merge base that
      # validates against the packet schema there must still validate against
      # the pull request's, and a valid fixture changes or goes only with the
      # api-breaking label and a changelog entry of kind breaking about the
      # packet, dated no earlier than today; no release contains the change
      # until 14 days after that date. The labels come from the event, through
      # the environment, never into the script.
      - run: node tools/repo-checks/src/check-packet-compat.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
