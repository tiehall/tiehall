name: CI

# The checks every pull request and every push to main must pass. Workflows are
# split by the permissions their jobs need (self-host-install: Release
# pipeline integrity): every job here reads the repository and nothing more.
# A job that needs a write permission or a secret lives in its own workflow
# and is listed in .github/workflow-policy.json, which the "Workflow rules"
# job enforces.

on:
  pull_request:
  push:
    branches: [main]

# Jobs get no token permissions unless they declare them.
permissions: {}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  test-shard:
    name: Test (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    # The whole suite on one 2-core runner, where the test files run almost
    # one at a time, outgrew 20 minutes once group 15's tests landed and 40
    # once group 28's did (about 41). So it runs in three shards, each a third
    # of the test files, side by side; each takes about a third of that. The
    # limit only stops a job that hangs.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every shard runs to the end, so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the coverage checks' tests run them on the real tree, and they read a list as the
          # newest change that modifies it words it, by when commits added the changes, which a checkout at depth 1
          # cannot tell.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/3
      # The screenshot tests' screenshots, one per page, size and scheme, kept for review whatever the tests did, since
      # no test compares them with a stored image; a shard whose test files saved none uploads nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-${{ matrix.shard }}
          path: test-results/screens/
          if-no-files-found: ignore

  # The check the branch protection requires keeps its name: it passes only
  # when the typecheck and every shard passed. It runs even when one of them
  # failed or was cancelled, because GitHub counts a skipped required check
  # as passed.
  test:
    name: Typecheck and test
    needs: [typecheck, test-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that the typecheck and every test shard passed
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "Typecheck: $TYPECHECK. Test shards: $SHARDS."
          test "$TYPECHECK" = success && test "$SHARDS" = success

  cli-node-22:
    name: CLI on Node.js 22
    runs-on: ubuntu-24.04
    # The tiehall CLI says it runs on Node.js 22 or later (its engines field and its launcher), while the rest of the
    # repository builds and tests on .node-version: this job builds the CLI's bundle and runs its tests on Node.js 22,
    # whose launcher tests start the bundle with this Node.js.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tiehall build
      - run: pnpm vitest run --project tiehall

  dependency-rules:
    name: Dependency rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:deps

  model-sdks:
    name: No model SDKs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # No model-vendor SDK, and no analytics SDK, error-reporting SDK or
      # update checker, in any package.json or among the packages the
      # lockfile resolves. Uses only Node built-ins, so it needs no install.
      # The image checks run the same denylists over the built image.
      - run: node tools/repo-checks/src/check-model-sdks.ts

  spec-reading:
    name: No spec reading on the server
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # No server package depends on an OpenAPI parser or diff tool, and no
      # server code reads a repository's files on GitHub. Uses only Node
      # built-ins, so it needs no install.
      - run: node tools/repo-checks/src/check-spec-reading.ts

  workflow-rules:
    name: Workflow rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks
      # Actions pinned by commit SHA, declared permissions, writes and secrets
      # only where the policy lists them, first-party steps only in the jobs
      # that can write, and frozen, script-free installs.
      - run: pnpm check:workflows
      # A failure in the fresh-install, upgrade, backup-and-restore,
      # polling-mode or egress test, or in the release check of stability
      # levels, stops every job of the release workflow that can push or
      # publish.
      - run: pnpm check:release-gates

  license-map:
    name: License map
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks
      # Apache-2.0 in the five client pieces of tools/repo-checks/license-map.json,
      # and AGPL-3.0 in the root and every other workspace package.
      - run: pnpm check:licenses

  openapi-document:
    name: OpenAPI document
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The graduation check reads openapi/changelog.json through
      # @tiehall/catalog/changelog, which imports only Node built-ins.
      - run: pnpm install --frozen-lockfile --filter @tiehall/catalog --filter @tiehall/repo-checks
      # Regenerates openapi/v1.json from the catalog and fails when it differs
      # from the committed file, so every API change is reviewed as a diff of
      # that file (public-api: Every API change is reviewed as a document diff).
      - run: pnpm check:openapi
      # Fails when an operation other than contract.report is stable in a
      # committed document or the tool snapshot without a graduation in
      # openapi/changelog.json, the maintainers' decision, recorded at least
      # four weeks after the last breaking change to it (public-api: Each
      # operation graduates on its own).
      - run: pnpm check:graduation

  client-package:
    name: Client package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter @tiehall/client
      # Regenerates @tiehall/client from openapi/v1.json, its types and the
      # command table the CLI builds its request commands from, read from each
      # operation's x-tiehall-cli extension, and fails when either differs from
      # the committed files (public-api: The client package `@tiehall/client`).
      # The openapi-document job has checked that openapi/v1.json is what the
      # catalog generates.
      - run: pnpm check:client

  claude-plugin:
    name: Claude Code plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The check reads the minimums Tiehall keeps, so packages/core is installed too.
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks --filter "@tiehall/core..."
      # packages/claude-plugin's manifest states the plugin's version and its
      # skill's frontmatter the skill's, neither older than the minimum Tiehall
      # keeps; the manifest has only the keys Claude Code knows, the skill is in
      # the Agent Skills format, and the MCP connection points at the /mcp of
      # the install whose URL the user gives (agent-surfaces: The Claude Code
      # plugin). The repository's .claude-plugin/marketplace.json, through which
      # Claude Code installs the plugin from the repository, lists it with only
      # the keys Claude Code reads.
      - run: pnpm check:plugin

  mcp-tools:
    name: MCP tool snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter @tiehall/catalog
      # Lints mcp/tools.json, failing on a $ref, $defs, or a root that is not an
      # object or has composition (agent-surfaces: Tool schemas that current
      # clients accept), and regenerates it from the catalog, failing when it
      # differs, so every tool change is reviewed as a diff of that file
      # (public-api: MCP tools follow the same compatibility rules).
      - run: pnpm check:mcp-tools

  packet-schema:
    name: Packet schema
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the forward-compatibility check reads every
          # version of every valid packet fixture.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The forward-compatibility check validates the fixtures with the packet's own validator, so packages/packet
      # is installed too.
      - run: pnpm install --frozen-lockfile --filter @tiehall/catalog --filter @tiehall/repo-checks --filter @tiehall/packet
      # Regenerates packages/packet/schema/v1-beta.json from the catalog's
      # packet definition and fails when it differs from the committed file,
      # when it and openapi/v1.json's packet component define different fields
      # or types, when an object of the schema forbids additional properties, or
      # when the operations that take and return packets use more than one
      # packet component (handoff-packet: One definition for the schema and the
      # API; handoff-packet: Open objects, strict server).
      - run: pnpm check:packet-schema
      # From the first published release on, the committed schema only adds
      # optional fields to every release in packages/packet/releases/, every
      # fixture that validated against a release still validates, and every
      # valid fixture validates against every release (handoff-packet: v1 only
      # gains optional fields after publication). Before v1.0, it passes.
      - run: pnpm check:packet-forward
      # packages/packet/releases/ holds each published release with its URL
      # as $id and v1.json as a copy of the latest, and no commit's release
      # file was changed or removed since (handoff-packet: Fixed release URLs);
      # the publication switch, packages/packet/publication.json, is on exactly
      # when it holds a release, and the packet's spec labels the schema beta
      # before and names its media type from then on (handoff-packet: The
      # packet media type).
      - run: pnpm check:packet-releases

  confirmation-coverage:
    name: Confirmation coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the check reads a list as the newest change that modifies it words it, by when commits
          # added the changes, which a checkout at depth 1 cannot tell.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The check reads the command catalog, so the catalog and its dependencies are installed too.
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks --filter "@tiehall/catalog..."
      # tools/repo-checks/confirmation-actions.json mirrors the spec's list of
      # actions that need the confirmation step; an action a finished task built
      # names its confirm command and an input for its two cases, which the
      # commands' tests run; and no confirm command is offered on REST, the CLI
      # or MCP (agent-safety: Actions that need the confirmation step;
      # agent-safety: The confirmation step runs only in the web UI).
      - run: pnpm check:confirmations

  security-event-coverage:
    name: Security-event coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the check reads a list as the newest change that modifies it words it, by when commits
          # added the changes, which a checkout at depth 1 cannot tell.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The check reads the event types Tiehall defines, so packages/core is installed too.
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks --filter "@tiehall/core..."
      # tools/repo-checks/security-events.json mirrors the spec's list of the
      # actions Tiehall records a security event for; an action a finished task
      # built names its security event and the test, run by `pnpm test`, that
      # shows the action appending that event together with its change; and
      # every security event type Tiehall defines is named by a listed action
      # (activity-log: Which actions are security events).
      - run: pnpm check:security-events

  error-model-coverage:
    name: Error model coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The check reads the rows of the error model Tiehall defines, so packages/core is installed too.
      - run: pnpm install --frozen-lockfile --filter @tiehall/repo-checks --filter "@tiehall/core..."
      # tools/repo-checks/error-model-tests.json names, for every row of the
      # error model, its test on REST, or why /api/v1 does not reach the row
      # with the test of the HTTP endpoint that does, and its test on MCP, a
      # tool error, or why tool errors do not apply to it; each named test runs
      # in `pnpm test` and names the row (public-api: One error model for
      # Tiehall's own refusals).
      - run: pnpm check:error-model

  migration-lint:
    name: Migration lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Migrations only add to the schema unless marked as contract steps, and
      # none changes data. Uses only Node built-ins, so it needs no install.
      - run: node packages/db/src/check-migrations.ts

  compose-policy:
    name: Compose policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # In the self-host Compose file: Postgres publishes no port, the app only
      # one on 127.0.0.1 and only the caddy profile 80 and 443; only migrate
      # receives the database owner's credentials; migrate and the app run
      # confined. It reads the file through `docker compose config` and uses
      # only Node built-ins.
      - run: node tools/repo-checks/src/check-compose.ts

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds no secrets: the scanner is third-party code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of every branch and tag, plus the pull request's own commits.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # gitleaks runs from its image pinned by digest, with no network and the
      # checkout mounted read-only; the script uses only Node built-ins.
      - run: node tools/repo-checks/src/scan-secrets.ts

  # Pull requests test a build of the pull request; main tests the pushed
  # digest in the Build workflow instead.
  image:
    name: Image
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-checks.yml
