name: Release

# A version tag makes a release (self-host-install: Releases carry signed
# attestations; self-host-install: Release pipeline integrity; design.md,
# Technical decisions: T13): v<major>.<minor>.<patch>, or a release candidate
# such as v1.3.0-rc.1, on a commit of main. The image is built once, for the
# release's version, from this repository; it is pushed once, by digest and
# tagged with the version, and that digest gets signed build-provenance and
# SBOM attestations (GitHub artifact attestations), pushed beside it to GHCR,
# which operators check with `gh attestation verify`. The release page names
# the digest and the version tag and offers compose.yaml, the Caddyfile,
# .env.example, backup.sh, restore.sh and the release notes. The tag is also
# the release of the client pieces the repository itself serves: the notes pin
# the contract Action to the tag's commit by its SHA, with the tag as a
# comment, and install the Claude Code plugin from the repository's plugin
# marketplace at the tag.
#
# Nothing is pushed or published before the two jobs that do, the only jobs
# that hold a write permission (.github/workflow-policy.json): the push job,
# which pushes the image and attests it, and the release job, which publishes
# the release. Both run only first-party steps: GitHub's own actions, the
# shell, Docker and gh, and in the release job the repository's own script
# that stages the release files, which imports nothing but Node's own modules.
# No package is installed and no dependency's code runs while they hold their
# permissions. The release notes, whose script needs the repository's
# dependencies, are written between them, from the digest the push job pushed,
# in a job that can write nothing. The release job takes only the notes from
# it, staged only when their artifact holds release-notes.md alone, as a
# regular file, and publishes the files it names, the other five from the
# tag's own commit, so that job's dependencies cannot change them.
# The image travels between the jobs as a saved image, a workflow artifact,
# which any job of the run could replace. So the build job gives the saved
# image's digest and the image's ID as its outputs, which no other job can
# change; the SBOM job scans the saved image only once its digest matches, and
# gives the SBOM's digest in turn; and the push job checks both downloads
# against those digests, loads the image and checks its ID before it pushes,
# so the image pushed and attested is the one the build job built, and the
# SBOM attested the one written from it.
# The release is gated (self-host-install: Upgrades apply migrations before the
# app starts; public-api: Each operation carries a stability level): the
# release check of stability levels runs before anything is built, and the
# image checks, the fresh-install, upgrade, backup-and-restore, polling-mode
# and egress tests among them, and the vulnerability scan run on the release's
# own image; the push job needs every one of them and the release job needs
# the push job, so a failure in any stops both. `pnpm check:release-gates`
# checks that a failure in each gate does, and that the scan runs as the Build
# workflow's scan does.
# The SBOM comes from the third-party scanner, pinned by digest, in a job of its
# own with no permissions, no secrets and no network, which reads only the saved
# image. The vulnerability scan is the Build workflow's scan (design.md,
# Technical decisions: T13, R-d): the same scanner, pinned by the same digest,
# with the same rules, so a fixable HIGH or CRITICAL vulnerability in the image
# stops the release. It runs in a job of its own with no permissions and no
# secrets, which reads only the saved image and has the network the scanner
# needs for its vulnerability database. The way out of a finding is its fix, or
# for Node's binary or an npm package whose fixed version is younger than the
# 7-day release age, the reviewed exception of D55 (86) in the OpenSpec change
# decisions-from-groups-15-28.

on:
  push:
    tags: ["v*"]

permissions: {}

# One run per tag at a time.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read the release from its tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      previous: ${{ steps.tag.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags and main's history, to check that the tag's commit is on main and to find the previous release.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter "@tiehall/repo-checks..."
      # A release offers no operation or tool at alpha, and every operation carries a stability level.
      - run: pnpm release:check-stability
      # The tag names a semantic version, which becomes the image's version tag, and points to a commit of main.
      - name: Read the release from its tag
        id: tag
        run: node tools/repo-checks/src/read-release-tag.ts "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      # Before anything is built: openapi/changelog.json records the release's API changes, its contract steps since
      # the previous release follow expand steps of earlier releases, and release/no-skip.json is well formed.
      - name: Check that the release notes can be written
        run: node tools/repo-checks/src/write-release-notes.ts "$VERSION" --previous "$PREVIOUS" --check
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}

  build:
    name: Build the image
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
      archive-sha256: ${{ steps.build.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As each build of main is built (build.yml), with the release's version: the migrate role records it with each
      # migration, init names the image by it, and the web UI links to the source at the release's tag.
      - name: Build the image once, for the release's version, and save it
        id: build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/$owner/tiehall"
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg TIEHALL_COMMIT_SHA="$GITHUB_SHA" \
            --build-arg TIEHALL_VERSION="$VERSION" \
            --build-arg TIEHALL_IMAGE_NAME="$repository" \
            --build-arg TIEHALL_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$repository:$VERSION" \
            .
          docker save "$repository:$VERSION" --output "$RUNNER_TEMP/image.tar"
          echo "image-id=$(docker image inspect "$repository:$VERSION" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "archive-sha256=$(sha256sum "$RUNNER_TEMP/image.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  sbom:
    name: Write the image's SBOM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The scanner is third-party code: no token permissions and no secrets, and it reads only the saved image.
    permissions: {}
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      # Third-party, pinned by digest, the same as the Build workflow's scan; Renovate proposes new digests after the
      # 7-day release age.
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Check the saved image against the build job's digest
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: echo "$ARCHIVE_SHA256  $RUNNER_TEMP/image/image.tar" | sha256sum --check --strict
      # The scanner runs with no network, a read-only root filesystem and no capabilities, as the runner's user, who
      # owns the saved image, and writes the SBOM as an SPDX document.
      - name: List the image's packages as an SPDX document
        run: |
          mkdir "$RUNNER_TEMP/sbom"
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/image/image.tar:/image.tar:ro" \
            --volume "$RUNNER_TEMP/sbom:/sbom" \
            "$TRIVY_IMAGE" image --input /image.tar --cache-dir /tmp/trivy \
            --format spdx-json --output /sbom/sbom.spdx.json --no-progress
      # Once the scanner has exited: the digest the push job checks the SBOM it attests against.
      - name: Give the SBOM's digest
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/sbom/sbom.spdx.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  # The Build workflow's scan, on the release's own image: a fixable HIGH or CRITICAL vulnerability stops the release.
  scan:
    name: Scan the image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The scanner is third-party code: no token permissions and no secrets, and it reads only the saved image.
    permissions: {}
    env:
      # Third-party, pinned by digest, the same as the Build workflow's scan; Renovate proposes new digests after the
      # 7-day release age.
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      # Where the Build workflow's scan saves the image it pulled, so the scan below is its command word for word.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Check the saved image against the build job's digest
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: echo "$ARCHIVE_SHA256  $RUNNER_TEMP/image.tar" | sha256sum --check --strict
      # As the Build workflow's scan runs it: the scanner gets only the saved image, no token, no Docker socket, no
      # checkout, a read-only root filesystem and no capabilities, and runs as the runner's user, who owns the saved
      # image; it has the network, for its vulnerability database.
      - name: Scan for fixable high and critical vulnerabilities
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            "$TRIVY_IMAGE" image --input /image.tar --cache-dir /tmp/trivy \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

  # The image tests, the self-host boot test and the operator tests, on the release's own image: the fresh install,
  # the end-to-end "It works" test, the egress and polling-mode tests, backup and restore, and the upgrade from the
  # previous release's image, the newest final release the tagged commit's parent holds, or before the first release
  # the image last built from main before it.
  image:
    name: Image
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-checks.yml
    with:
      image-artifact: image
      previous-base: ${{ github.sha }}^

  push:
    name: Push and attest the image
    needs: [prepare, build, sbom, scan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # To push the image and its attestations.
      packages: write
      # To sign the attestations with the workflow's identity.
      id-token: write
      # To store the attestations.
      attestations: write
    outputs:
      repository: ${{ steps.push.outputs.repository }}
      digest: ${{ steps.push.outputs.digest }}
    # No checkout and no Node: the job runs GitHub's own actions, Docker and the shell, and nothing of a package.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      # The image the build job saved and the SBOM the SBOM job wrote, not files another job of the run put in their place.
      - name: Check the saved image and the SBOM against the digests their jobs gave
        id: check
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          SBOM_SHA256: ${{ needs.sbom.outputs.sha256 }}
        run: |
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/image/image.tar" | sha256sum --check --strict
          echo "$SBOM_SHA256  $RUNNER_TEMP/sbom/sbom.spdx.json" | sha256sum --check --strict
      # The one push of the image: by digest, tagged with the release's version. The job stays logged in to GHCR for
      # the attestations, which are pushed beside the image, and logs out after them.
      - name: Push the image by digest, tagged with its version
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/$owner/tiehall"
          docker load --input "$RUNNER_TEMP/image/image.tar"
          loaded="$(docker image inspect "$repository:$VERSION" --format '{{.Id}}')"
          if [ "$loaded" != "$IMAGE_ID" ]; then
            echo "::error::The loaded image $loaded is not the image the build job built, $IMAGE_ID."
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$repository:$VERSION"
          digest="$(docker buildx imagetools inspect "$repository:$VERSION" --format '{{.Manifest.Digest}}')"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$repository:$VERSION@$digest\`." >> "$GITHUB_STEP_SUMMARY"
      # Without a predicate, the action attests the build provenance of the run that built the image.
      - name: Attest the image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # The notes name the image, its attestations and files, the install and the upgrade, every release up to this one
  # that must not be skipped, the contract steps this release adds, the contract Action pinned by the commit the tag
  # points to (GITHUB_SHA of a tag's run), the Claude Code plugin at the tag, and its API changes. The script needs the
  # repository's dependencies, so it runs here, in a job that can write nothing, and not in a job that pushes or
  # publishes.
  notes:
    name: Write the release notes
    needs: [prepare, push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous release's tag, whose migrations tell which contract steps this release adds.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter "@tiehall/repo-checks..."
      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          IMAGE: ${{ needs.push.outputs.repository }}:${{ needs.prepare.outputs.version }}@${{ needs.push.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/notes"
          node tools/repo-checks/src/write-release-notes.ts "$VERSION" \
            --previous "$PREVIOUS" \
            --image "$IMAGE" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/notes/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish the release
    needs: [prepare, push, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To create the release and upload its files.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The notes, in a folder of their own: the notes job runs the repository's dependencies, whose code could put
      # other files in the artifact, or a folder in the notes' place.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      # The release files come from the tag's own commit, and the notes from that folder only when it holds
      # release-notes.md alone, as a regular file, into a new folder. The script imports only Node's own modules and
      # the list of release files, so nothing is installed for it.
      - name: Gather the release files
        run: node tools/repo-checks/src/stage-release-files.ts "$RUNNER_TEMP/release" --notes "$RUNNER_TEMP/notes"
      # The notes are the release page's text and one of its files, and the release publishes the files it names and
      # no other. gh uploads them to a draft and publishes it once every file is there; a release candidate is marked
      # as a pre-release.
      - name: Publish the release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Tiehall $VERSION" \
            --notes-file release-notes.md "${prerelease[@]}" \
            compose.yaml Caddyfile env.example backup.sh restore.sh release-notes.md
