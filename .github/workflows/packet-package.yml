name: Packet package

# Publishes @tiehall/packet to npm (handoff-packet: The npm package; public-api:
# Client pieces are built from public source with provenance; design.md,
# Technical decisions: T13): the package of the Apache-2.0 schema directory,
# built from this repository with the packet's types, the validator and the
# fixtures and without the fencing renderer, and published from CI with npm's
# trusted publishing and provenance, never from a laptop.
#
# It stays off until the schema is published (handoff-packet: When the schema
# is published): a maintainer starts it, and its build and publish jobs run
# only once packages/packet/releases/ holds a release, whose version the
# package takes, and only on main: npm's trusted publishing trusts this
# workflow file whichever branch runs it, so the jobs refuse any other ref.
# The build job, which can write nothing, installs the package's
# dependencies, builds the package, checks it and packs it. The publish job
# holds the OIDC token permission, through which npm's trusted publishing
# authenticates it and signs the provenance, and nothing else, and it runs
# only GitHub's own actions and npm itself, never a dependency's code
# (self-host-install: Release pipeline integrity; .github/workflow-policy.json):
# it publishes the tarball the build job packed, once its digest matches the
# one that job gave.

on:
  workflow_dispatch:

permissions: {}

# One publish at a time.
concurrency:
  group: packet-package
  cancel-in-progress: false

jobs:
  prepare:
    name: Read the publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      published: ${{ steps.publication.outputs.published }}
      version: ${{ steps.publication.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter "@tiehall/repo-checks..."
      # published=true and the package's version once the release-URL tree holds a release; published=false before.
      - name: Read whether the packet schema is published
        id: publication
        run: node tools/repo-checks/src/read-packet-publication.ts >> "$GITHUB_OUTPUT"

  build:
    name: Build and check @tiehall/packet
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter @tiehall/packet
      - name: Build the package
        run: node packages/packet/src/build-package.ts --version "$VERSION" --out "$RUNNER_TEMP/package"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      # The pack dry run holds no renderer and no source, and the validator, installed from the tarball, accepts every
      # valid fixture and rejects every invalid one.
      - name: Check the package's content and its validator
        run: node packages/packet/src/check-package.ts "$RUNNER_TEMP/package"
      # The tarball npm publishes as it is; npm pack prints its file name.
      - name: Pack the package
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/tarball"
          tarball="$(npm pack "$RUNNER_TEMP/package" --ignore-scripts --pack-destination "$RUNNER_TEMP/tarball" --loglevel error)"
          sha256="$(cd "$RUNNER_TEMP/tarball" && sha256sum "$tarball" | cut -d ' ' -f 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed \`$tarball\`, sha256 \`$sha256\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/tarball/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish @tiehall/packet
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To read .node-version.
      contents: read
      # npm's trusted publishing authenticates the publish with the job's OIDC token and signs its provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/tarball
      # The tarball the build job checked and packed, not one another job put in its place.
      - name: Check the tarball against the build job's digest
        working-directory: ${{ runner.temp }}/tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check --strict
      - name: Publish the package with provenance
        working-directory: ${{ runner.temp }}/tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts
