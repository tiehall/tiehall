name: Image checks

# The image's container tests, the self-host boot test and the operator
# tests, as one reusable workflow: CI calls it on pull requests to test a build
# of the pull request, and the Build workflow calls it on main to test, by
# digest, the image it pushed (self-host-install: Tiehall's containers are
# confined; self-host-install: Compose runs Tiehall and Postgres;
# self-host-install: Setup names the company and makes the first admin;
# self-host-install: Backups with the shipped scripts; self-host-install:
# Upgrades apply migrations before the app starts; self-host-install:
# Migrations expand, then contract), and the end-to-end "It works" test of a
# fresh install (agent-surfaces: Four agent surfaces; requester-loop: Pull is
# the contract; requests: Commitments become proposals; requests: Cross-team
# commitments need a confirmation from each side). The operator tests that
# need the previous image take the image last built from main before the
# commit under test (get-previous-image.sh): the pull request's base, or the
# commit main was at before the push.

on:
  workflow_call:
    inputs:
      image:
        description: The image to test, pinned by digest. Empty tests a build of the checked-out commit.
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  image-tests:
    name: Image tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter @tiehall/image-tests
      - name: Get the image
        run: tools/image-tests/get-image.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
          GHCR_TOKEN: ${{ github.token }}
      # Each role on a read-only root filesystem, as a non-root uid; an unknown role exits non-zero.
      - run: pnpm test:image

  boot-test:
    name: Self-host boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Get the image
        run: tools/image-tests/get-image.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
          GHCR_TOKEN: ${{ github.token }}
      # Boots deploy/compose.yaml with the image in role all against stock
      # postgres:17 and waits for /healthz to report healthy.
      - run: node tools/image-tests/src/boot-test.ts

  fresh-install-test:
    name: Fresh install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The GitHub stub and the install docs' commands come from @tiehall/testing and @tiehall/repo-checks,
      # workspace dependencies of the image tests.
      - run: pnpm install --frozen-lockfile --filter "@tiehall/image-tests..."
      - name: Get the image
        run: tools/image-tests/get-image.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
          GHCR_TOKEN: ${{ github.token }}
      # The install docs' commands, run by name: the release files downloaded, the .env init prints,
      # deploy/compose.yaml started with and without the caddy profile, the setup code from `docker compose logs
      # app`, the setup screen and the App's manifest flow against the GitHub stub in the runner's Chrome, the first
      # admin, a team and a request, and the commands on the host.
      - run: pnpm test:install fresh-install

  it-works-test:
    name: It works
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The GitHub stub, the tiehall CLI, which the test builds from the repository, and the MCP SDK client come with
      # the image tests' workspace dependencies.
      - run: pnpm install --frozen-lockfile --filter "@tiehall/image-tests..."
      - name: Get the image
        run: tools/image-tests/get-image.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
          GHCR_TOKEN: ${{ github.token }}
      # A fresh install set up through the setup screen against the GitHub stub in the runner's Chrome; two people in
      # two teams signed in with GitHub, their CLIs signed in through the device flow and an MCP SDK client approved on
      # the consent screen; then a request, a blocking question that wakes `tiehall hook wait`, its answer, a due date
      # confirmed by both sides and a decline confirmed and undone in the web UI.
      - run: pnpm test:install it-works

  backup-test:
    name: Backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history, to find the image last built from main before this commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The install docs' commands come from @tiehall/repo-checks, a workspace dependency of the image tests.
      - run: pnpm install --frozen-lockfile --filter "@tiehall/image-tests..."
      - name: Get the image
        run: tools/image-tests/get-image.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
          GHCR_TOKEN: ${{ github.token }}
      - name: Get the previous image
        run: tools/image-tests/get-previous-image.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GHCR_TOKEN: ${{ github.token }}
      # backup.sh writes a timestamped dump only its owner can read and records the finished backup; restore.sh
      # restores it into an empty database and the app boots with the data; a dump from the previous image is
      # brought up to date by migrate.
      - run: pnpm test:install backup

  upgrade-test:
    name: Upgrade and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history, to find the image last built from main before this commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (the version in package.json "packageManager")
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      # The install docs' commands come from @tiehall/repo-checks, a workspace dependency of the image tests.
      - run: pnpm install --frozen-lockfile --filter "@tiehall/image-tests..."
      - name: Get the image
        run: tools/image-tests/get-image.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}
          GHCR_TOKEN: ${{ github.token }}
      - name: Get the previous image
        run: tools/image-tests/get-previous-image.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GHCR_TOKEN: ${{ github.token }}
      # The previous image with seeded data, upgraded with `docker compose pull && docker compose up -d`: the seeded
      # data is served after the upgrade, a failing fixture migration keeps the app off the new image and the schema
      # on the old one with the reason in the log, and an upgrade across two releases succeeds. After an upgrade with
      # only expand steps, the previous image starts again on the newer schema; after a contract step it refuses to.
      - run: pnpm test:install upgrade rollback
