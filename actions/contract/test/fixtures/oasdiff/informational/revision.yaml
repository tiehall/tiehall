openapi: 3.1.0
info:
  title: Payments API
  version: 1.5.0
paths:
  /payments:
    get:
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The payments, newest first.
    post:
      operationId: createPayment
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
      responses:
        "201":
          description: The payment was created.
  /payments/{id}:
    get:
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                type: object
                required: [id, amount, status]
                properties:
                  id:
                    type: string
                  amount:
                    type: integer
                  status:
                    type: string
  /refunds:
    get:
      operationId: listRefunds
      responses:
        "200":
          description: The refunds, newest first.
