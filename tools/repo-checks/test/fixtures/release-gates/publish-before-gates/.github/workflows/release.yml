on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: node tools/read-release-tag.ts
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: docker build --tag tiehall:release .
  image:
    needs: [prepare, build]
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
  release:
    needs: [prepare, build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - run: docker push ghcr.io/acme/tiehall:1.3.0
      - run: pnpm release:check-stability
