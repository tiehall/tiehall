on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: node tools/read-release-tag.ts
      - run: pnpm release:check-stability
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: docker build --tag tiehall:release .
  image:
    needs: [prepare, build]
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
  gate:
    needs: [prepare, build, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "The checks ran."
  release:
    needs: [gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - run: docker push ghcr.io/acme/tiehall:1.3.0
      - if: always()
        run: docker logout ghcr.io
