on:
  workflow_call:
permissions: {}
# A shell of the workflow's own, bash without -e, for every step that names none and whose job names none.
defaults:
  run:
    shell: bash {0}
jobs:
  # The job's default shell, bash, which GitHub runs with -e and pipefail, overrides the workflow's.
  fresh-install:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - run: tools/get-image.sh
      - run: pnpm test:install fresh-install 2>&1 | tee "$RUNNER_TEMP/fresh-install.log"
  # The workflow's default shell goes on past the failing test.
  upgrade:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - run: |
          pnpm test:install upgrade rollback
          echo "upgrade done"
  # A block over several lines, whose failure the list lets through.
  backup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          {
            pnpm test:install backup
          } || true
  # A condition over several lines, which may skip the test.
  backup-if:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          if [ -n "$RUN_BACKUP" ]; then
            pnpm test:install backup
          fi
  # pipefail turned off before a pipeline.
  polling:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          set +o pipefail
          pnpm test:install polling | tee "$RUNNER_TEMP/polling.log"
  # A list begun on the line before: echo succeeds, so the test never runs.
  polling-or:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          echo "polling" ||
            pnpm test:install polling
  # A trap that ends the script in success whatever made it exit.
  egress:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          trap 'exit 0' EXIT
          pnpm test:install egress
  # A function that takes the place of pnpm.
  egress-function:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          pnpm() { echo "skipped"; }
          pnpm test:install egress
  # An exit before the test, which never runs.
  egress-exit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          exit 0
          pnpm test:install egress
  # The test inside a quoted text over several lines, which only prints it.
  egress-quoted:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          echo "the egress test:
          pnpm test:install egress
          "
  # The test in a here-document, which only prints it.
  egress-heredoc:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          cat <<'SCRIPT'
          pnpm test:install egress
          SCRIPT
  # Lines before the test that only turn on -e and -u, print a quoted comment sign, and comment: its failure still
  # fails the step.
  fresh-install-prelude:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          set -eu
          # The fresh-install test, on the saved image.
          echo "fresh install #1"
          pnpm test:install fresh-install
  # A case whose pattern may not match, which skips the test.
  egress-case:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          case "$SUITE" in
            egress)
              pnpm test:install egress
              ;;
          esac
  # A backtick substitution over several lines, whose output echo prints: echo succeeds whatever the test did.
  egress-backtick:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          echo `
          pnpm test:install egress
          `
  # set -n reads the rest of the script without running it.
  egress-noexec:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          set -n
          pnpm test:install egress
  # set -o noexec, by its name.
  polling-noexec:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          set -o noexec
          pnpm test:install polling
  # set -t ends the script after the next command, before the test.
  backup-onecmd:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          set -t
          echo "backup"
          pnpm test:install backup
  # A block's keyword as an argument: the loop never runs, and the test is its body.
  upgrade-keyword-argument:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          while false; do echo fi
          pnpm test:install upgrade rollback
          done
  # An ANSI-C quoted text holds an escaped quote, so the quote after it opens a text the test sits in.
  egress-ansi-c:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          echo $'\'' ; echo '
          pnpm test:install egress
          '
  # An escaped quote, likewise.
  egress-escaped-quote:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          echo \" ; echo "
          pnpm test:install egress
          "
  # A file the check does not read, which may define pnpm as a function.
  egress-source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          . tools/test-env.sh
          pnpm test:install egress
  # Text run as a command, here a function in pnpm's place.
  egress-eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          eval "pnpm() { :; }"
          pnpm test:install egress
  # shopt turns off -e as set +o errexit does.
  egress-shopt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          shopt -u -o errexit
          pnpm test:install egress
          echo "egress done"
  # hash puts another program in pnpm's place.
  egress-hash:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          hash -p /usr/bin/true pnpm
          pnpm test:install egress
  # A comment sign inside a quoted text starts no comment, so the list after it lets the failure through. A block
  # scalar keeps the line whole: in a plain one, YAML would read " #" as the start of a comment of its own.
  egress-quoted-hash:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          pnpm test:install egress --reporter "dot #" || true
  # An escaped space keeps the comment sign after it inside a word, so the list after it lets the failure through.
  egress-escaped-space-hash:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          pnpm test:install egress --reporter dot\ #x || true
  # Likewise on a line before the test: the set after it turns off -e.
  egress-escaped-space-before:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - shell: bash
        run: |
          echo ready\ #; set +e
          pnpm test:install egress
          echo done
