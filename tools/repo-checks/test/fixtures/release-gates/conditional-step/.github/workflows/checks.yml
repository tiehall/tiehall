on:
  workflow_call:
permissions: {}
jobs:
  fresh-install:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - if: github.event_name == 'pull_request'
        run: pnpm test:install fresh-install
  backup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - run: pnpm test:install backup
  upgrade:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - run: pnpm test:install upgrade rollback
  polling:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - run: pnpm test:install polling
  egress:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: tools/get-image.sh
      - run: pnpm test:install egress
