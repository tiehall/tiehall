lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      openapi-typescript:
        specifier: 7.0.0
        version: 7.0.0
      vitest:
        specifier: 5.0.1
        version: 5.0.1

  packages/a:
    dependencies:
      '@aws-sdk/client-s3':
        specifier: 3.0.0
        version: 3.0.0
      '@google-cloud/storage':
        specifier: 7.0.0
        version: 7.0.0
      '@modelcontextprotocol/server':
        specifier: 2.1.0
        version: 2.1.0
      '@opentelemetry/api':
        specifier: 1.9.0
        version: 1.9.0
      aws-sdk-lookalike:
        specifier: npm:@aws-sdk/client-s3@3.0.0
        version: '@aws-sdk/client-s3@3.0.0'

packages:

  '@aws-sdk/client-s3@3.0.0':
    resolution: {integrity: sha512-fixture}

  '@google-cloud/storage@7.0.0':
    resolution: {integrity: sha512-fixture}

  '@modelcontextprotocol/server@2.1.0':
    resolution: {integrity: sha512-fixture}

  '@openapitools/openapi-generator-cli@2.0.0':
    resolution: {integrity: sha512-fixture}

  '@opentelemetry/api@1.9.0':
    resolution: {integrity: sha512-fixture}

  aion@1.0.0:
    resolution: {integrity: sha512-fixture}

  openapi-typescript@7.0.0:
    resolution: {integrity: sha512-fixture}

  vitest@5.0.1:
    resolution: {integrity: sha512-fixture}

snapshots:

  '@aws-sdk/client-s3@3.0.0': {}

  '@google-cloud/storage@7.0.0': {}

  '@modelcontextprotocol/server@2.1.0': {}

  '@openapitools/openapi-generator-cli@2.0.0': {}

  '@opentelemetry/api@1.9.0': {}

  aion@1.0.0: {}

  openapi-typescript@7.0.0:
    dependencies:
      '@openapitools/openapi-generator-cli': 2.0.0
      aion: 1.0.0

  vitest@5.0.1: {}
